name: Deploy Frontends to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'admin/**'
      - '.github/workflows/deploy-frontends.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://vsparkz-api.onrender.com/api' }}
      VITE_ADMIN_URL: ${{ vars.VITE_ADMIN_URL || 'https://vichuviju.github.io/vsparkz/admin' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build website
        working-directory: website
        run: |
          npm ci
          npm run build:pages
          cp dist/index.html dist/404.html

      - name: Install and build admin
        working-directory: admin
        run: |
          npm ci
          npm run build:pages
          cp dist/index.html dist/404.html

      - name: Combine website + admin into one site
        run: |
          mkdir -p website/dist/admin/login
          cp -r admin/dist/* website/dist/admin/
          cp website/dist/admin/index.html website/dist/admin/login/index.html
          touch website/dist/.nojekyll
          touch website/dist/admin/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
