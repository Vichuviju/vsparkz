services:
  - type: web
    name: vsparkz-api
    runtime: php
    plan: free
    buildCommand: |
      cd backend
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan migrate --force
      php artisan db:seed --force
    startCommand: cd backend && php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: CORS_ALLOWED_ORIGINS
        value: https://vichuviju.github.io,http://localhost:5173,http://localhost:5174
      - key: APP_KEY
        generateValue: true
    disk:
      name: vsparkz-data
      mountPath: /var/data
      sizeGB: 1
