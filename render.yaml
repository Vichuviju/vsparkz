# Free-tier compatible: Docker + external PostgreSQL (Neon recommended)
services:
  - type: web
    name: vsparkz-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DB_PORT
        value: "5432"
      # Paste your Neon connection string in Render Dashboard → Environment
      - key: DB_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://vichuviju.github.io,http://localhost:5173,http://localhost:5174
      - key: RENDER_OUTBOUND_IP_RANGES
        value: 74.220.48.0/24,74.220.56.0/24
      - key: FRONTEND_URL
        value: https://vichuviju.github.io/vsparkz
      - key: APP_KEY
        generateValue: true
